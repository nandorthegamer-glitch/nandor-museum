<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vampaladin</title>
  <!-- Template del cabinato del Nandor Orbital Museum: il gioco a tutta finestra dentro un
       iframe del museo, schermata di caricamento da sala giochi. Vedi VampBuild, menu 5. -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #000; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 22px; background: #050203; color: #e02838;
      font-family: Consolas, "Courier New", monospace; letter-spacing: 0.2em; }
    #loading h1 { margin: 0; font-size: clamp(28px, 6vw, 64px); text-shadow: 0 0 18px rgba(224, 40, 56, 0.6); }
    #bar { width: min(420px, 70vw); height: 14px; border: 2px solid #e02838; padding: 2px; }
    #fill { height: 100%; width: 0; background: #e02838; }
    #msg { color: #a08878; font-size: 14px; letter-spacing: 0.15em; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <h1>VAMPALADIN</h1>
    <div id="bar"><div id="fill"></div></div>
    <div id="msg"></div>
  </div>
  <script>
    var en = location.search.indexOf('lang=en') >= 0;
    var msg = document.querySelector('#msg');
    msg.textContent = en ? 'LOADING...' : 'CARICAMENTO...';
    var canvas = document.querySelector('#unity-canvas');
    var buildUrl = 'Build';
    var config = {
      arguments: [],
      dataUrl: buildUrl + '/vampaladin.data.unityweb',
      frameworkUrl: buildUrl + '/vampaladin.framework.js.unityweb',
      codeUrl: buildUrl + '/vampaladin.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "DefaultCompany",
      productName: "Vampaladin",
      productVersion: "0.1.0",
    };
    var script = document.createElement('script');
    script.src = buildUrl + '/vampaladin.loader.js';
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.querySelector('#fill').style.width = (100 * p) + '%';
      }).then(function () {
        document.querySelector('#loading').style.display = 'none';
        window.focus();
        canvas.focus(); // i tasti vanno subito al gioco
        try { window.parent.postMessage({ source: 'vampaladin', type: 'ready' }, '*'); } catch (e) {}
      }).catch(function (e) {
        msg.textContent = (en ? 'ERROR: ' : 'ERRORE: ') + e;
      });
    };
    document.body.appendChild(script);
    canvas.addEventListener('pointerdown', function () { canvas.focus(); });
  </script>
</body>
</html>
